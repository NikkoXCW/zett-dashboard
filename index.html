        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #f4f7fc, #e6e9f2); /* Gradient background */
            color: #333;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        h2 {
        font-size: 2.5rem;
        color: #63973F;
        margin-top: 30px;
        }
        
        .container {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr; /* Three columns for image + data + image */
            gap: 20px;
            padding: 20px;
            justify-items: center;
            align-items: stretch;
        }
        
        /* Navigation Button Styles */
        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
    
        .nav-buttons button {
            padding: 12px 20px;
            font-size: 18px;
            cursor: pointer;
            background-color: #63973F;
            color: white;
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .nav-buttons button:hover {
            background-color: #4a7e2f;
            transform: translateY(-2px); /* Button lift effect */
        }

        .page-container {
            display: none;
            padding: 40px;
        }

        #Page1 {
            display: block;
        }
        
        /* styles for the ZETT - Volvo BEV Trial page */

            display: flex; 
            justify-content: flex-start; 
            align-items: stretch; 
            margin: 20px auto; 
            max-width: 1200px; 
        }
        
        /* Value Box Styling */
        .value-box {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 10px;
            background-color: #fff;
            border-radius: 6px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
    
        .value-box label {
            font-weight: bold;
            color: #333;
            margin-right: 10px;
        }
    
        .value-box span {
            font-size: 18px;
            font-weight: bold;
            color: #63973F;
        }
        
        /* Table Styling */
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            margin-top: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
    
        th, td {
            padding: 12px;
            text-align: center;
            cursor: pointer;
            border-bottom: 1px solid #ddd;
            transition: background-color 0.3s ease;
        }
    
        th {
            background-color: #f7f7f7;
            font-weight: bold;
        }
    
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    
        tr:hover {
            background-color: #e0f4e0;
        }
        
         /* Chart Container Styling */
        .chart-container {
            display: none;
            position: fixed;
            top: 10%;
            left: 10%;
            width: 80%;
            height: 60%;
            background: white;
            padding: 20px;
            border: 1px solid #ddd;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            cursor:move;
            overflow: hidden;
        }  
        
        .close-btn {
            font-size: 24px;  
            color: #63973F;  
            font-weight: bold; 
            cursor: pointer;
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: transparent;
            border: none;
            padding: 10px;
            border-radius: 50%;  /* Optional, for rounded corners */
            transition: background-color 0.3s;

        .close-btn:hover {
            background-color: #f4f4f4;  /* Change background on hover */
        }

            justify-content: flex-start;

        }

            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            margin: 40px;
            width: 100%;

        // Function to filter the data based on date range
        function filterData(pageIndex) {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            
            // Check if both startDate and endDate are provided
            if (!startDate || !endDate) {
                // Render the corresponding page table without filtering if no dates are selected
                renderTable(pageIndex);
                return;
            }
            
            const startDateObj = new Date(startDate);
            const endDateObj = new Date(endDate);
            
            // Log dates for debugging
            console.log('Start Date:', startDateObj);
            console.log('End Date:', endDateObj);
        
            let sheetData;  // Define a variable to hold the data based on the page index
        
            // Assign the correct data based on the page index
            switch(pageIndex) {
                case 1:
                    sheetData = sheetDataPage1;
                    break;
                case 2:
                    sheetData = sheetDataPage2;
                    break;
                case 3:
                    sheetData = sheetDataPage3;
                    break;
                case 4:
                    sheetData = sheetDataPage4;
                    break;
                default:
                    console.error('Invalid page index.');
                    return;
            }
            
            const filteredData = sheetData.filter(row => {
                const rowDate = row[0]; // Assuming the first column contains the date
                
                // Parse the date from the row and ensure it's valid
                const rowDateObj = new Date(rowDate);
                if (isNaN(rowDateObj)) {
                    console.error(`Invalid date: ${rowDate}`);
                    return false; // Skip invalid dates
                }
        
                return rowDateObj >= startDateObj && rowDateObj <= endDateObj;
            });
            
            // Render the filtered data for the selected page
            renderTable(pageIndex, filteredData);
        }

                    break;
                default:
                    alert("Invalid page index.");
                    closeChart();
                    return;
            }
        
            // Debugging log: Check which data set is being passed
            console.log(`Data for page ${pageIndex}:`, sheetData);
        
            // Make sure sheetData is available
            if (!sheetData || sheetData.length === 0) {
                alert("No data available for this page.");
                closeChart();
                return;
            }

            // Ensure selectedColumns and columnIndex are valid
            if (!Array.isArray(selectedColumns) || selectedColumns.length === 0) {
                console.error("Invalid or empty selectedColumns array:", selectedColumns);
                closeChart();
                return;
            }
        
            // Check if columnIndex exists in selectedColumns
            if (columnIndex >= selectedColumns.length) {
                console.error("Invalid columnIndex:", columnIndex);
                closeChart();
                return;
            }
        
            // Collecting data for the trend chart (Y values)
            const trendData = [];
            const validDates = [];
        
            sheetData.forEach(row => {
                if (!selectedColumns || columnIndex >= selectedColumns.length) {
                    console.error("Invalid selectedColumns array or columnIndex:", selectedColumns, columnIndex);
                    return;
                }
                let rawValue = row[selectedColumns[columnIndex]];
                if (rawValue) {
                    rawValue = rawValue.replace(/[^0-9.-]/g, ''); // Remove "$", "," or any non-numeric characters
                }
        
                const value = parseFloat(rawValue);
        
                if (!isNaN(value)) {
                    trendData.push(value);
                    validDates.push(row[0]); // Corresponding date for the valid value
                }
            });
        
            if (trendData.length === 0) {
                alert("No valid data for this column.");
                closeChart();
                return;
            }
        
            // Find the min and max values for dynamic scaling
            const minValue = Math.min(...trendData);
            const maxValue = Math.max(...trendData);
        
            // Destroy the existing chart if it exists
            if (trendChart) {
                trendChart.destroy();
            }
        
            const columnLabel = columnNames && columnNames[columnIndex] ? columnNames[columnIndex] : "Unknown Column";
        
            // Create a new chart
            trendChart = new Chart(chartCanvas, {
                type: 'line',
                data: {
                    labels: validDates, // Use filtered valid dates
                    datasets: [{
                        label: columnLabel, // Dynamically use the column label
                        data: trendData,
                        borderColor: 'rgba(75, 192, 192, 1)',
                        fill: false,
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        x: { type: 'category' },
                        y: {
                            beginAtZero: false, // Start the y-axis at the minimum value
                            min: minValue * 0.95, // 5% below the minimum value
                            max: maxValue * 1.05, // 5% above the maximum value
                            ticks: {
                                suggestedMin: minValue * 0.95, // Optional, for better control
                                suggestedMax: maxValue * 1.05 // Optional, for better control
                            }
                        }
                    },
                    plugins: {
                        tooltip: {
                            callbacks: {
                                label: function (context) {
                                    return `${context.dataset.label}: ${context.raw.toFixed(2)} (${context.label})`; // Show value with precision
                                }
                            }
                        }
                    }
                }
            });
        }
        
        // Function to close the chart and hide the chart container
        function closeChart() {
            const chartContainer = document.getElementById("chartPopup");
            chartContainer.style.display = "none"; // Hide the chart
            if (trendChart) {
                trendChart.destroy(); // Destroy the chart to clear memory
            }
        }

        let isDragging = false;
        let offsetX, offsetY;
        
       const chartContainer = document.getElementById("chartPopup");

        chartContainer.addEventListener("mousedown", (event) => {
            isDragging = true;
            offsetX = event.clientX - chartContainer.getBoundingClientRect().left;
            offsetY = event.clientY - chartContainer.getBoundingClientRect().top;
            document.body.style.cursor = 'move'; // Change cursor style to indicate drag mode
        });

        document.addEventListener("mousemove", (event) => {
            if (isDragging) {
                chartContainer.style.left = `${event.clientX - offsetX}px`;
                chartContainer.style.top = `${event.clientY - offsetY}px`;
            }
        });

        document.addEventListener("mouseup", () => {
            isDragging = false;
            document.body.style.cursor = ''; // Reset cursor style
        });

        window.onload = function() {
            // Load Page 2
            loadPage('Page2');
            fetchValueBoxDataPage2(); // For Page 2
            fetchTableDataPage2();  // For Page 2

            // Load Page 3
            loadPage('Page3');
            fetchValueBoxDataPage3(); // For Page 3
            fetchTableDataPage3();  // For Page 3

            // Load Page 4
            loadPage('Page4');
            fetchValueBoxDataPage4(); // For Page 4
            fetchTableDataPage4();  // For Page 4

            loadPage('Page1');  // Automatically load Page 1 by default
            fetchValueBoxDataPage1();
            fetchTableDataPage1();
        };
    </script>
